<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حرير — لوحة الإدارة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300D4E8'/><text y='.9em' font-size='65' x='50%' text-anchor='middle' dominant-baseline='middle' dy='.1em'>⚡</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --cyan:#00D4E8;--cyan-dk:#00b8c9;
  --bg:#F5F7FA;--card:#fff;
  --fg:#2e3340;--fg2:#4A4A5A;--fg3:#8890a0;
  --silver:#C0C8D0;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--fg)}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;background:none}

/* LAYOUT */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:240px;background:#0a2a30;color:#fff;
  display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;
}
.sidebar-logo{
  padding:0 20px 24px;border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:16px;
}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg,var(--cyan) 0%,#0099aa 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0;
  box-shadow:0 4px 16px rgba(0,212,232,.4);
}
.logo-text{line-height:1}
.logo-text .logo-ar{
  font-family:'Cairo',sans-serif;
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg,var(--cyan),#7feef7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:3px;display:block;
}
.logo-text span{
  color:rgba(255,255,255,.45);font-size:10px;font-weight:500;
  display:block;margin-top:2px;letter-spacing:2px;
}
.sidebar-logo span{display:block;font-size:11px;color:rgba(255,255,255,.5);font-weight:400;margin-top:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;font-size:15px;font-weight:600;
  color:rgba(255,255,255,.7);transition:all .2s;cursor:pointer;
  border-right:3px solid transparent;
}
.nav-item:hover,.nav-item.active{
  background:rgba(0,212,232,.1);color:var(--cyan);
  border-right-color:var(--cyan);
}
.main{flex:1;overflow:auto}
.topbar{
  background:var(--card);border-bottom:1px solid var(--silver);
  padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.topbar h1{font-family:'Cairo',sans-serif;font-size:20px;font-weight:700}
.content{padding:24px}

/* LOGIN */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a2a30,#1a4a52);
}
.login-box{
  background:var(--card);border-radius:20px;padding:40px;
  width:360px;text-align:center;
}
.login-box .logo{font-family:'Cairo',sans-serif;font-size:32px;font-weight:900;color:var(--cyan);margin-bottom:4px}
.login-box p{color:var(--fg3);margin-bottom:28px;font-size:14px}
.form-group{text-align:right;margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:6px}
.form-group input{
  width:100%;padding:11px 14px;border-radius:10px;
  border:2px solid var(--silver);background:var(--bg);color:var(--fg);font-size:14px;
}
.form-group input:focus{outline:none;border-color:var(--cyan)}
.login-btn{
  width:100%;padding:13px;border-radius:10px;
  background:var(--cyan);color:#0a2a30;font-size:16px;font-weight:700;
  margin-top:8px;transition:background .2s;
}
.login-btn:hover{background:var(--cyan-dk)}
.err{color:#ff4757;font-size:13px;margin-top:8px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--card);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.stat-card .label{font-size:13px;color:var(--fg3);margin-bottom:8px}
.stat-card .value{
  font-family:'Cairo',sans-serif;font-size:28px;font-weight:900;color:var(--cyan);
}
.stat-card .sub{font-size:12px;color:var(--fg3);margin-top:4px}

/* TABLE */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-head{
  padding:16px 20px;border-bottom:1px solid var(--silver);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.table-head h3{font-family:'Cairo',sans-serif;font-weight:700}
.search-input{
  padding:9px 14px;border-radius:8px;
  border:2px solid var(--silver);background:var(--bg);
  color:var(--fg);font-size:13px;width:200px;
}
.search-input:focus{outline:none;border-color:var(--cyan)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  background:var(--bg);padding:12px 16px;
  text-align:right;font-weight:700;color:var(--fg2);
  border-bottom:1px solid var(--silver);
}
td{padding:14px 16px;border-bottom:1px solid var(--bg);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* STATUS BADGE */
.status{
  display:inline-block;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:700;
}
.status.pending  {background:#fff3cd;color:#856404}
.status.confirmed{background:#d1ecf1;color:#0c5460}
.status.shipped  {background:#d4edda;color:#155724}
.status.delivered{background:#d4edda;color:#155724}
.status.cancelled{background:#f8d7da;color:#721c24}

/* ACTION BTNS */
.action-row{display:flex;gap:6px;flex-wrap:wrap}
.action-btn{
  padding:5px 12px;border-radius:6px;font-size:12px;font-weight:700;
  border:2px solid;transition:all .2s;
}
.action-btn.view {border-color:var(--cyan);color:var(--cyan)}
.action-btn.view:hover{background:var(--cyan);color:#0a2a30}
.action-btn.del  {border-color:#ff4757;color:#ff4757}
.action-btn.del:hover{background:#ff4757;color:#fff}

/* STATUS QUICK BTNS */
.status-btns{display:flex;gap:4px;flex-wrap:wrap}
.s-btn{
  padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;
  border:1.5px solid;cursor:pointer;transition:all .15s;background:transparent;
}
.s-btn.pending  {border-color:#856404;color:#856404}
.s-btn.confirmed{border-color:#0c5460;color:#0c5460}
.s-btn.shipped  {border-color:#155724;color:#155724}
.s-btn.delivered{border-color:#155724;color:#155724}
.s-btn.cancelled{border-color:#721c24;color:#721c24}
.s-btn.active{color:#fff!important}
.s-btn.pending.active  {background:#856404}
.s-btn.confirmed.active{background:#0c5460}
.s-btn.shipped.active  {background:#155724}
.s-btn.delivered.active{background:#155724}
.s-btn.cancelled.active{background:#721c24}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  border:2px solid var(--silver);color:var(--fg2);cursor:pointer;
  transition:all .2s;background:var(--bg);
}
.filter-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.filter-btn.active{background:var(--cyan);border-color:var(--cyan);color:#0a2a30}
.filter-btn .count{
  display:inline-block;background:rgba(0,0,0,.12);border-radius:10px;
  padding:0 6px;font-size:11px;margin-right:4px;
}
.filter-btn.active .count{background:rgba(0,0,0,.15)}

/* LIVE INDICATOR */
.live-bar{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;background:var(--bg);
  border-bottom:1px solid var(--silver);font-size:12px;color:var(--fg3);
}
.live-dot{
  width:8px;height:8px;border-radius:50%;background:#22c55e;
  animation:pulse-dot 2s infinite;flex-shrink:0;
}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.live-countdown{
  margin-right:auto;font-weight:600;color:var(--fg2);
  font-variant-numeric:tabular-nums;
}

/* NEW ORDER HIGHLIGHT */
@keyframes flash-row{
  0%,100%{background:transparent}
  30%{background:rgba(0,212,232,.12)}
}
.row-new{animation:flash-row 1.5s ease 2}

/* PRODUCT FORM */
.form-card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group2{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-group2 label{font-size:13px;font-weight:600;color:var(--fg2)}
.form-group2 input,
.form-group2 select,
.form-group2 textarea{
  padding:10px 14px;border-radius:10px;border:2px solid var(--silver);
  background:var(--bg);color:var(--fg);font-size:14px;font-family:inherit;
}
.form-group2 input:focus,
.form-group2 select:focus,
.form-group2 textarea:focus{outline:none;border-color:var(--cyan)}
.save-btn{
  padding:12px 28px;border-radius:10px;background:var(--cyan);
  color:#0a2a30;font-size:15px;font-weight:700;transition:background .2s;
}
.save-btn:hover{background:var(--cyan-dk)}

/* TOAST */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1e2230;color:#fff;padding:10px 22px;border-radius:24px;
  font-weight:600;font-size:14px;z-index:999;transition:transform .3s;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* LANG TOGGLE */
.lang-toggle{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;
  border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);
  font-size:12px;font-weight:700;cursor:pointer;
  transition:all .2s;background:transparent;
}
.lang-toggle:hover{border-color:var(--cyan);color:var(--cyan)}
[lang="en"] body{font-family:'Inter',sans-serif}

/* LANG BTN */
.lang-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:20px;
  border:2px solid var(--silver);color:var(--fg2);
  font-size:13px;font-weight:700;
  transition:all .2s;white-space:nowrap;cursor:pointer;
}
.lang-btn:hover{border-color:var(--cyan);color:var(--cyan)}

/* EN overrides */
[lang="en"] body,[lang="en"] input,[lang="en"] select,[lang="en"] textarea,[lang="en"] button{font-family:'Inter',sans-serif}
[lang="en"] h1,[lang="en"] h3{font-family:'Inter',sans-serif}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{display:none}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px">
      <div style="width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#00D4E8,#0099aa);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 20px rgba(0,212,232,.4)">⚡</div>
      <div style="font-family:'Cairo',sans-serif;font-size:30px;font-weight:900;background:linear-gradient(135deg,#00D4E8,#0099aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px">حَرِيْر</div>
    </div>
    <p>لوحة الإدارة — تسجيل الدخول</p>
    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="admin@harir.store">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <div style="position:relative">
        <input type="password" id="loginPass" placeholder="••••••••" style="padding-left:40px;width:100%">
        <button type="button" id="togglePass" onclick="togglePassword()" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#8896a8;font-size:18px;line-height:1;display:flex;align-items:center" title="إظهار/إخفاء كلمة المرور">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <button class="login-btn" id="loginBtn">دخول</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ADMIN SHELL -->
<div class="shell" id="adminShell" style="display:none">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-wrap">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
          <span class="logo-ar">حَرِيْر</span>
          <span>Admin Panel</span>
        </div>
      </div>
    </div>
    <div class="nav-item active" data-tab="dashboard">📊 الرئيسية</div>
    <div class="nav-item" data-tab="orders">📦 الطلبات</div>
    <div class="nav-item" data-tab="products">🛍️ المنتجات</div>
    <div class="nav-item" data-tab="add-product">➕ منتج جديد</div>

  <div class="main">

          <span id="langFlag">🇬🇧</span>
          <span id="langLabel">EN</span>
        </button>
        <span style="font-size:13px;color:var(--fg3)" id="adminEmail"></span>
      </div>
    </div>

    <div class="content">
      <!-- DASHBOARD -->
      <div id="tab-dashboard">
        <div class="stats-row" id="statsRow">
          <div class="stat-card"><div class="label">إجمالي الطلبات</div><div class="value" id="sOrders">—</div></div>
          <div class="stat-card"><div class="label">في الانتظار</div><div class="value" id="sPending">—</div></div>
          <div class="stat-card"><div class="label">إجمالي الإيرادات</div><div class="value" id="sRevenue">—</div><div class="sub">ج.م</div></div>
          <div class="stat-card"><div class="label">عدد المنتجات</div><div class="value" id="sProducts">—</div></div>

      <!-- ORDERS -->

              <button class="filter-btn" data-filter="shipped">جاري التوصيل <span class="count" id="fc-shipped">0</span></button>
              <button class="filter-btn" data-filter="delivered">تم التسليم <span class="count" id="fc-delivered">0</span></button>
              <button class="filter-btn" data-filter="cancelled">ملغي <span class="count" id="fc-cancelled">0</span></button>
            </div>
          </div>
          <!-- LIVE BAR -->
          <div class="live-bar">
            <div class="live-dot"></div>
            <span>تحديث تلقائي</span>
            <span class="live-countdown" id="liveCountdown">30 ث</span>
            <span id="lastUpdated" style="margin-right:8px"></span>

      <!-- PRODUCTS -->

      <!-- ADD PRODUCT -->
      <div id="tab-add-product" style="display:none">

          <h3 style="font-family:'Cairo',sans-serif;font-weight:700;margin-bottom:20px">➕ إضافة منتج جديد</h3>

              <label>اسم المنتج *</label>
              <input type="text" id="pName" placeholder="مثال: شاحن Anker 20W">

            <div class="form-group2">
              <label>الماركة</label>
              <select id="pBrand">
                <option>Anker</option><option>Apple</option>

              </select>

              <label>الفئة</label>

              <label>المخزون</label>
              <input type="number" id="pStock" placeholder="50">
            </div>
          </div>
          <div class="form-group2">
            <label>رابط الصورة</label>
            <input type="url" id="pImg" placeholder="https://...">

            <label>الوصف</label>

          <button class="save-btn" id="saveProduct">💾 حفظ المنتج</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════
// ⚙️  CONFIG — same as index.html
// ════════════════════════════════
const SUPABASE_URL = 'https://ojocqktlpegfksfmoens.supabase.co';
const SUPABASE_KEY = 'sb_publishable_p5nQEl0c9UB5NZaJf5Didw_HfGWm_bO';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ════════════════════════════════
// 👁  PASSWORD TOGGLE
// ════════════════════════════════
function togglePassword(){
  const inp = document.getElementById('loginPass');
  const eyeOn  = document.getElementById('eyeIcon');
  const eyeOff = document.getElementById('eyeOffIcon');
  if(inp.type === 'password'){
    inp.type = 'text';
    eyeOn.style.display  = 'none';
    eyeOff.style.display = 'block';
  } else {
    inp.type = 'password';
    eyeOn.style.display  = 'block';
    eyeOff.style.display = 'none';
  }
}

// ════════════════════════════════
// 🔑  AUTH
// ════════════════════════════════
async function checkAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ showAdmin(session.user); loadAll(); }
  else { applyAdminLang(); } // apply lang on login screen too
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;

// 📊  LOAD DATA + LIVE REFRESH
// ════════════════════════════════
let allOrders=[], allProds=[], currentFilter='all', refreshTimer=null, countdown=30, lastOrderIds=new Set();

async function loadAll(){
  await Promise.all([loadDashboard(), loadOrders(), loadProducts(), loadCatsForForm()]);
  startLiveRefresh();
}

function startLiveRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  countdown=30;
  refreshTimer = setInterval(async ()=>{
    countdown--;
    const el = document.getElementById('liveCountdown');
    if(el) el.textContent = countdown + ' ث';
    if(countdown<=0){
      countdown=30;
      await refreshOrders();
    }
  }, 1000);
}

async function forceRefresh(){
  countdown=30;
  const el = document.getElementById('liveCountdown');
  if(el) el.textContent='30 ث';
  await refreshOrders();
}

async function refreshOrders(){
  const prevIds = new Set(allOrders.map(o=>o.id));
  await Promise.all([loadDashboard(), loadOrders()]);
  // check for new orders
  const newOrders = allOrders.filter(o=>!prevIds.has(o.id));
  if(newOrders.length && prevIds.size>0){
    playNotification();
    toast(t('newOrder', newOrders.length));
  }
  const now = new Date();
  const el = document.getElementById('lastUpdated');
  if(el) el.textContent = t('lastUpdated', now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}));
}

function playNotification(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [523,659,784].forEach((freq,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=freq; o.type='sine';
      g.gain.setValueAtTime(0,ctx.currentTime+i*.15);
      g.gain.linearRampToValueAtTime(.3,ctx.currentTime+i*.15+.05);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+i*.15+.25);
      o.start(ctx.currentTime+i*.15);
      o.stop(ctx.currentTime+i*.15+.3);
    });
  }catch(e){}
}

async function loadDashboard(){
  const [{ count:oCount }, { data:orders }, { count:pCount }] = await Promise.all([
    sb.from('orders').select('*',{count:'exact',head:true}),
    sb.from('orders').select('*').order('created_at',{ascending:false}).limit(8),
    sb.from('products').select('*',{count:'exact',head:true})
  ]);
  const pending  = (orders||[]).filter(o=>o.status==='pending').length;
  const revenue  = (orders||[]).filter(o=>o.status!=='cancelled').reduce((s,o)=>s+parseFloat(o.total||0),0);
  document.getElementById('sOrders').textContent   = oCount||0;
  document.getElementById('sPending').textContent  = pending;
  document.getElementById('sRevenue').textContent  = revenue.toLocaleString('ar-EG');
  document.getElementById('sProducts').textContent = pCount||0;
  renderOrdersTable('recentOrdersTable', orders||[]);
}

async function loadOrders(){
  const { data } = await sb.from('orders').select('*').order('created_at',{ascending:false});
  allOrders = data||[];
  updateFilterCounts();
  applyFilter(currentFilter);
}

function updateFilterCounts(){
  const statuses = ['pending','confirmed','shipped','delivered','cancelled'];
  document.getElementById('fc-all').textContent = allOrders.length;
  statuses.forEach(s=>{
    const el = document.getElementById('fc-'+s);
    if(el) el.textContent = allOrders.filter(o=>o.status===s).length;
  });
}

function applyFilter(filter){
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.filter===filter);
  });
  const q = document.getElementById('orderSearch').value.toLowerCase();
  let filtered = filter==='all' ? allOrders : allOrders.filter(o=>o.status===filter);
  if(q) filtered = filtered.filter(o=>
    o.customer_name?.toLowerCase().includes(q)||
    o.customer_phone?.includes(q)||
    o.order_number?.toLowerCase().includes(q)
  );
  renderOrdersTable('ordersTable', filtered);
}

async function loadProducts(){
  const { data } = await sb.from('products').select('*, categories(name)').order('created_at',{ascending:false});
  allProds = data||[];
  renderProductsTable(allProds);
}

async function loadCatsForForm(){
  const { data } = await sb.from('categories').select('*');
  const sel = document.getElementById('pCat');
  (data||[]).forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.name; sel.appendChild(o); });
}

// 🖼️  RENDER TABLES

function statusBadge(s){
  const labels = { pending:'في الانتظار', confirmed:'مؤكد', shipped:'جاري التوصيل', delivered:'تم التسليم', cancelled:'ملغي' };
  return `<span class="status ${s}">${labels[s]||s}</span>`;
}

function getStatusLabels(){ return currentLang==='ar'
  ? { pending:'⏳ انتظار', confirmed:'✅ مؤكد', shipped:'🚚 جاري', delivered:'🎉 تسليم', cancelled:'❌ ملغي' }
  : { pending:'⏳ Pending', confirmed:'✅ Confirmed', shipped:'🚚 Shipped', delivered:'🎉 Delivered', cancelled:'❌ Cancelled' };
}

function renderOrdersTable(targetId, orders){
  const wrap = document.getElementById(targetId);
  if(!orders.length){ wrap.innerHTML=`<p style="padding:24px;color:var(--fg3)">${t('noOrders')}</p>`; return; }
  const isNew = id => !lastOrderIds.has(id) && lastOrderIds.size>0;
  wrap.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>${t('colOrder')}</th><th>${t('colName')}</th><th>${t('colPhone')}</th><th>${t('colTotal')}</th><th>${t('colStatus')}</th><th>${t('colDate')}</th><th>${t('colChange')}</th></tr></thead>
    <tbody>${orders.map(o=>`<tr class="${isNew(o.id)?'row-new':''}" id="row-${o.id}">
      <td style="font-weight:700;color:var(--cyan)">${o.order_number||'—'}</td>
      <td style="font-weight:600">${escHtml(o.customer_name)}</td>
      <td dir="ltr" style="font-size:13px">${o.customer_phone}</td>
      <td style="font-weight:700">${parseFloat(o.total||0).toLocaleString('ar-EG')} ${t('currency')}</td>
      <td>${statusBadge(o.status)}</td>
      <td style="font-size:12px;color:var(--fg3)">${new Date(o.created_at).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'})}</td>
      <td>
        <div class="status-btns">
          ${Object.entries(getStatusLabels()).map(([s,l])=>`
            <button class="s-btn ${s}${o.status===s?' active':''}" onclick="updateStatus('${o.id}','${s}',this)">${l}</button>
          `).join('')}
        </div>
      </td>
    </tr>`).join('')}
    </tbody>
  </table></div>`;
  // track shown ids
  lastOrderIds = new Set(orders.map(o=>o.id));
}

function renderProductsTable(prods){
  const wrap = document.getElementById('productsTable');
  if(!prods.length){ wrap.innerHTML=`<p style="padding:24px;color:var(--fg3)">${t('noProds')}</p>`; return; }
  wrap.innerHTML = `<table>
    <thead><tr><th>${t('colProdName')}</th><th>${t('colCat')}</th><th>${t('colBrand')}</th><th>${t('colPrice')}</th><th>${t('colStock')}</th><th>${t('colAction')}</th></tr></thead>
    <tbody>${prods.map(p=>`<tr>
      <td style="font-weight:700">${escHtml(p.name)}</td>
      <td>${p.categories?.name||'—'}</td>
      <td>${p.brand||'—'}</td>
      <td>${parseFloat(p.price).toLocaleString('ar-EG')} ${t('currency')}</td>
      <td>${p.stock??0}</td>
      <td>
        <div class="action-row">
          <button class="action-btn del" onclick="deleteProduct('${p.id}')">${t('delBtn')}</button>
        </div>
      </td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

// ════════════════════════════════
// ✏️  ACTIONS
// ════════════════════════════════
async function updateStatus(orderId, status, btn){
  // optimistic UI: update buttons immediately
  if(btn){
    const row = btn.closest('tr');
    row.querySelectorAll('.s-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    // update badge in same row
    const badgeCell = row.cells[4];
    if(badgeCell) badgeCell.innerHTML = statusBadge(status);
  }
  const { error } = await sb.from('orders').update({ status }).eq('id', orderId);
  if(error){ toast('❌ فشل التحديث'); loadOrders(); }
  else{
    toast(t('toastUpdated', getStatusLabels()[status]));
    // update local array
    const o = allOrders.find(x=>x.id===orderId);
    if(o) o.status=status;
    updateFilterCounts();
  }
}

async function deleteProduct(id){
  if(!confirm(t('delConfirm'))) return;
  const { error } = await sb.from('products').delete().eq('id', id);
  if(error) toast(t('errDel'));
  else { toast(t('toastDeleted')); loadProducts(); }
}

document.getElementById('saveProduct').addEventListener('click', async ()=>{
  const name  = document.getElementById('pName').value.trim();
  const price = parseFloat(document.getElementById('pPrice').value);
  if(!name||!price){ toast(t('errFields')); return; }

  const { error } = await sb.from('products').insert({
    name,
    brand:     document.getElementById('pBrand').value,
    price,
    old_price: parseFloat(document.getElementById('pOld').value)||null,
    category_id: parseInt(document.getElementById('pCat').value)||null,
    stock:     parseInt(document.getElementById('pStock').value)||0,
    image_url: document.getElementById('pImg').value||null,
    description: document.getElementById('pDesc').value||null,
  });
  if(error){ toast(t('errSave')); console.error(error); }
  else { toast(t('toastSaved')); loadProducts(); }
});

}
