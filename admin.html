<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حرير — لوحة الإدارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --cyan:#00D4E8;--cyan-dk:#00b8c9;
  --bg:#F5F7FA;--card:#fff;
  --fg:#2e3340;--fg2:#4A4A5A;--fg3:#8890a0;
  --silver:#C0C8D0;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--fg)}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;background:none}

/* LAYOUT */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:240px;background:#0a2a30;color:#fff;
  display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;
}
.sidebar-logo{
  font-family:'Cairo',sans-serif;font-size:24px;font-weight:900;
  color:var(--cyan);padding:0 20px 24px;border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:16px;
}
.sidebar-logo span{display:block;font-size:11px;color:rgba(255,255,255,.5);font-weight:400;margin-top:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;font-size:15px;font-weight:600;
  color:rgba(255,255,255,.7);transition:all .2s;cursor:pointer;
  border-right:3px solid transparent;
}
.nav-item:hover,.nav-item.active{
  background:rgba(0,212,232,.1);color:var(--cyan);
  border-right-color:var(--cyan);
}
.main{flex:1;overflow:auto}
.topbar{
  background:var(--card);border-bottom:1px solid var(--silver);
  padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.topbar h1{font-family:'Cairo',sans-serif;font-size:20px;font-weight:700}
.content{padding:24px}

/* LOGIN */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a2a30,#1a4a52);
}
.login-box{
  background:var(--card);border-radius:20px;padding:40px;
  width:360px;text-align:center;
}
.login-box .logo{font-family:'Cairo',sans-serif;font-size:32px;font-weight:900;color:var(--cyan);margin-bottom:4px}
.login-box p{color:var(--fg3);margin-bottom:28px;font-size:14px}
.form-group{text-align:right;margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:6px}
.form-group input{
  width:100%;padding:11px 14px;border-radius:10px;
  border:2px solid var(--silver);background:var(--bg);color:var(--fg);font-size:14px;
}
.form-group input:focus{outline:none;border-color:var(--cyan)}
.login-btn{
  width:100%;padding:13px;border-radius:10px;
  background:var(--cyan);color:#0a2a30;font-size:16px;font-weight:700;
  margin-top:8px;transition:background .2s;
}
.login-btn:hover{background:var(--cyan-dk)}
.err{color:#ff4757;font-size:13px;margin-top:8px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--card);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.stat-card .label{font-size:13px;color:var(--fg3);margin-bottom:8px}
.stat-card .value{
  font-family:'Cairo',sans-serif;font-size:28px;font-weight:900;color:var(--cyan);
}
.stat-card .sub{font-size:12px;color:var(--fg3);margin-top:4px}

/* TABLE */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-head{
  padding:16px 20px;border-bottom:1px solid var(--silver);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.table-head h3{font-family:'Cairo',sans-serif;font-weight:700}
.search-input{
  padding:9px 14px;border-radius:8px;
  border:2px solid var(--silver);background:var(--bg);
  color:var(--fg);font-size:13px;width:200px;
}
.search-input:focus{outline:none;border-color:var(--cyan)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  background:var(--bg);padding:12px 16px;
  text-align:right;font-weight:700;color:var(--fg2);
  border-bottom:1px solid var(--silver);
}
td{padding:14px 16px;border-bottom:1px solid var(--bg);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* STATUS BADGE */
.status{
  display:inline-block;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:700;
}
.status.pending  {background:#fff3cd;color:#856404}
.status.confirmed{background:#d1ecf1;color:#0c5460}
.status.shipped  {background:#d4edda;color:#155724}
.status.delivered{background:#d4edda;color:#155724}
.status.cancelled{background:#f8d7da;color:#721c24}

/* ACTION BTNS */
.action-row{display:flex;gap:6px}
.action-btn{
  padding:5px 12px;border-radius:6px;font-size:12px;font-weight:700;
  border:2px solid;transition:all .2s;
}
.action-btn.view {border-color:var(--cyan);color:var(--cyan)}
.action-btn.view:hover{background:var(--cyan);color:#0a2a30}
.action-btn.del  {border-color:#ff4757;color:#ff4757}
.action-btn.del:hover{background:#ff4757;color:#fff}

/* PRODUCT FORM */
.form-card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group2{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-group2 label{font-size:13px;font-weight:600;color:var(--fg2)}
.form-group2 input,
.form-group2 select,
.form-group2 textarea{
  padding:10px 14px;border-radius:10px;border:2px solid var(--silver);
  background:var(--bg);color:var(--fg);font-size:14px;font-family:inherit;
}
.form-group2 input:focus,
.form-group2 select:focus,
.form-group2 textarea:focus{outline:none;border-color:var(--cyan)}
.save-btn{
  padding:12px 28px;border-radius:10px;background:var(--cyan);
  color:#0a2a30;font-size:15px;font-weight:700;transition:background .2s;
}
.save-btn:hover{background:var(--cyan-dk)}

/* TOAST */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1e2230;color:#fff;padding:10px 22px;border-radius:24px;
  font-weight:600;font-size:14px;z-index:999;transition:transform .3s;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{display:none}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="logo">حرير</div>
    <p>لوحة الإدارة — تسجيل الدخول</p>
    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="admin@harir.store">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <button class="login-btn" id="loginBtn">دخول</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ADMIN SHELL -->
<div class="shell" id="adminShell" style="display:none">
  <nav class="sidebar">
    <div class="sidebar-logo">حرير<span>Admin Panel</span></div>
    <div class="nav-item active" data-tab="dashboard">📊 الرئيسية</div>
    <div class="nav-item" data-tab="orders">📦 الطلبات</div>
    <div class="nav-item" data-tab="products">🛍️ المنتجات</div>
    <div class="nav-item" data-tab="add-product">➕ منتج جديد</div>
    <div class="nav-item" style="margin-top:auto" id="logoutBtn">🚪 خروج</div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">الرئيسية</h1>
      <span style="font-size:13px;color:var(--fg3)" id="adminEmail"></span>
    </div>

    <div class="content">
      <!-- DASHBOARD -->
      <div id="tab-dashboard">
        <div class="stats-row" id="statsRow">
          <div class="stat-card"><div class="label">إجمالي الطلبات</div><div class="value" id="sOrders">—</div></div>
          <div class="stat-card"><div class="label">في الانتظار</div><div class="value" id="sPending">—</div></div>
          <div class="stat-card"><div class="label">إجمالي الإيرادات</div><div class="value" id="sRevenue">—</div><div class="sub">ج.م</div></div>
          <div class="stat-card"><div class="label">عدد المنتجات</div><div class="value" id="sProducts">—</div></div>
        </div>
        <div class="table-wrap">
          <div class="table-head"><h3>آخر الطلبات</h3></div>
          <div id="recentOrdersTable"></div>
        </div>
      </div>

      <!-- ORDERS -->
      <div id="tab-orders" style="display:none">
        <div class="table-wrap">
          <div class="table-head">
            <h3>جميع الطلبات</h3>
            <input class="search-input" id="orderSearch" placeholder="بحث...">
          </div>
          <div id="ordersTable"></div>
        </div>
      </div>

      <!-- PRODUCTS -->
      <div id="tab-products" style="display:none">
        <div class="table-wrap">
          <div class="table-head">
            <h3>المنتجات</h3>
            <input class="search-input" id="productSearch" placeholder="بحث...">
          </div>
          <div id="productsTable"></div>
        </div>
      </div>

      <!-- ADD PRODUCT -->
      <div id="tab-add-product" style="display:none">
        <div class="form-card">
          <h3 style="font-family:'Cairo',sans-serif;font-weight:700;margin-bottom:20px">➕ إضافة منتج جديد</h3>
          <div class="form-row">
            <div class="form-group2">
              <label>اسم المنتج *</label>
              <input type="text" id="pName" placeholder="مثال: شاحن Anker 20W">
            </div>
            <div class="form-group2">
              <label>الماركة</label>
              <select id="pBrand">
                <option>Anker</option><option>Apple</option>
                <option>Samsung</option><option>ThreeTech</option><option>أخرى</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group2">
              <label>السعر (ج.م) *</label>
              <input type="number" id="pPrice" placeholder="299">
            </div>
            <div class="form-group2">
              <label>السعر القديم (ج.م)</label>
              <input type="number" id="pOld" placeholder="350">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group2">
              <label>الفئة</label>
              <select id="pCat"><option value="">اختر...</option></select>
            </div>
            <div class="form-group2">
              <label>المخزون</label>
              <input type="number" id="pStock" placeholder="50">
            </div>
          </div>
          <div class="form-group2">
            <label>رابط الصورة</label>
            <input type="url" id="pImg" placeholder="https://...">
          </div>
          <div class="form-group2">
            <label>الوصف</label>
            <textarea id="pDesc" placeholder="وصف مختصر..."></textarea>
          </div>
          <button class="save-btn" id="saveProduct">💾 حفظ المنتج</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════
// ⚙️  CONFIG — same as index.html
// ════════════════════════════════
const SUPABASE_URL = 'https://ojocqktlpegfksfmoens.supabase.co';
const SUPABASE_KEY = 'sb_publishable_p5nQEl0c9UB5NZaJf5Didw_HfGWm_bO';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ════════════════════════════════
// 🔑  AUTH
// ════════════════════════════════
async function checkAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ showAdmin(session.user); loadAll(); }
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ document.getElementById('loginErr').textContent = 'بيانات خاطئة!'; return; }
  showAdmin(data.user); loadAll();
});

function showAdmin(user){
  document.getElementById('loginWrap').style.display  = 'none';
  document.getElementById('adminShell').style.display = 'flex';
  document.getElementById('adminEmail').textContent   = user.email;
}

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  location.reload();
});

// ════════════════════════════════
// 🗂️  TABS
// ════════════════════════════════
const titles = { dashboard:'الرئيسية', orders:'الطلبات', products:'المنتجات', 'add-product':'منتج جديد' };
document.querySelectorAll('.nav-item[data-tab]').forEach(el=>{
  el.addEventListener('click',()=>{
    const tab = el.dataset.tab;
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('[id^="tab-"]').forEach(t=>t.style.display='none');
    document.getElementById('tab-'+tab).style.display='block';
    document.getElementById('pageTitle').textContent = titles[tab];
  });
});

// ════════════════════════════════
// 📊  LOAD DATA
// ════════════════════════════════
let allOrders=[], allProds=[];

async function loadAll(){
  await Promise.all([loadDashboard(), loadOrders(), loadProducts(), loadCatsForForm()]);
}

async function loadDashboard(){
  const [{ count:oCount }, { data:orders }, { count:pCount }] = await Promise.all([
    sb.from('orders').select('*',{count:'exact',head:true}),
    sb.from('orders').select('*').order('created_at',{ascending:false}).limit(8),
    sb.from('products').select('*',{count:'exact',head:true})
  ]);
  const pending  = (orders||[]).filter(o=>o.status==='pending').length;
  const revenue  = (orders||[]).filter(o=>o.status!=='cancelled').reduce((s,o)=>s+parseFloat(o.total||0),0);
  document.getElementById('sOrders').textContent   = oCount||0;
  document.getElementById('sPending').textContent  = pending;
  document.getElementById('sRevenue').textContent  = revenue.toLocaleString('ar-EG');
  document.getElementById('sProducts').textContent = pCount||0;
  renderOrdersTable('recentOrdersTable', orders||[]);
}

async function loadOrders(){
  const { data } = await sb.from('orders').select('*').order('created_at',{ascending:false});
  allOrders = data||[];
  renderOrdersTable('ordersTable', allOrders);
}

async function loadProducts(){
  const { data } = await sb.from('products').select('*, categories(name)').order('created_at',{ascending:false});
  allProds = data||[];
  renderProductsTable(allProds);
}

async function loadCatsForForm(){
  const { data } = await sb.from('categories').select('*');
  const sel = document.getElementById('pCat');
  (data||[]).forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.name; sel.appendChild(o); });
}

// ════════════════════════════════
// 🖼️  RENDER TABLES
// ════════════════════════════════
function statusBadge(s){
  const labels = { pending:'في الانتظار', confirmed:'مؤكد', shipped:'جاري التوصيل', delivered:'تم التسليم', cancelled:'ملغي' };
  return `<span class="status ${s}">${labels[s]||s}</span>`;
}

function renderOrdersTable(targetId, orders){
  const wrap = document.getElementById(targetId);
  if(!orders.length){ wrap.innerHTML='<p style="padding:24px;color:var(--fg3)">لا توجد طلبات</p>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr></thead>
    <tbody>${orders.map(o=>`<tr>
      <td style="font-weight:700;color:var(--cyan)">${o.order_number||'—'}</td>
      <td>${escHtml(o.customer_name)}</td>
      <td dir="ltr">${o.customer_phone}</td>
      <td>${parseFloat(o.total||0).toLocaleString('ar-EG')} ج.م</td>
      <td>${statusBadge(o.status)}</td>
      <td style="font-size:12px;color:var(--fg3)">${new Date(o.created_at).toLocaleDateString('ar-EG')}</td>
      <td>
        <div class="action-row">
          <select onchange="updateStatus('${o.id}',this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid var(--silver);background:var(--bg);color:var(--fg);font-size:12px">
            ${['pending','confirmed','shipped','delivered','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderProductsTable(prods){
  const wrap = document.getElementById('productsTable');
  if(!prods.length){ wrap.innerHTML='<p style="padding:24px;color:var(--fg3)">لا توجد منتجات</p>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr><th>الاسم</th><th>الفئة</th><th>الماركة</th><th>السعر</th><th>المخزون</th><th>إجراء</th></tr></thead>
    <tbody>${prods.map(p=>`<tr>
      <td style="font-weight:700">${escHtml(p.name)}</td>
      <td>${p.categories?.name||'—'}</td>
      <td>${p.brand||'—'}</td>
      <td>${parseFloat(p.price).toLocaleString('ar-EG')} ج.م</td>
      <td>${p.stock??0}</td>
      <td>
        <div class="action-row">
          <button class="action-btn del" onclick="deleteProduct('${p.id}')">حذف</button>
        </div>
      </td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

// ════════════════════════════════
// ✏️  ACTIONS
// ════════════════════════════════
async function updateStatus(orderId, status){
  const { error } = await sb.from('orders').update({ status }).eq('id', orderId);
  if(error) toast('❌ فشل التحديث');
  else toast('✅ تم تحديث الحالة');
}

async function deleteProduct(id){
  if(!confirm('هتحذف المنتج ده؟')) return;
  const { error } = await sb.from('products').delete().eq('id', id);
  if(error) toast('❌ فشل الحذف');
  else { toast('✅ تم الحذف'); loadProducts(); }
}

document.getElementById('saveProduct').addEventListener('click', async ()=>{
  const name  = document.getElementById('pName').value.trim();
  const price = parseFloat(document.getElementById('pPrice').value);
  if(!name||!price){ toast('⚠️ الاسم والسعر مطلوبان'); return; }

  const { error } = await sb.from('products').insert({
    name,
    brand:     document.getElementById('pBrand').value,
    price,
    old_price: parseFloat(document.getElementById('pOld').value)||null,
    category_id: parseInt(document.getElementById('pCat').value)||null,
    stock:     parseInt(document.getElementById('pStock').value)||0,
    image_url: document.getElementById('pImg').value||null,
    description: document.getElementById('pDesc').value||null,
  });
  if(error){ toast('❌ حدث خطأ'); console.error(error); }
  else { toast('✅ تم حفظ المنتج'); loadProducts(); }
});

// ════════════════════════════════
// 🔍  SEARCH FILTERS
// ════════════════════════════════
document.getElementById('orderSearch').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  renderOrdersTable('ordersTable', allOrders.filter(o=>
    o.customer_name?.toLowerCase().includes(q) ||
    o.customer_phone?.includes(q) ||
    o.order_number?.toLowerCase().includes(q)
  ));
});

document.getElementById('productSearch').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  renderProductsTable(allProds.filter(p=>p.name.toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q)));
});

// ════════════════════════════════
// 🍞  TOAST & UTILS
// ════════════════════════════════
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}
function escHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

// INIT
checkAuth();
</script>
</body>
</html>
