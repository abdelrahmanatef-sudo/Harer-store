<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حرير — اكسسوارات الموبايل الأصلية</title>
<meta name="description" content="تسوق أفضل اكسسوارات الموبايل الأصلية في مصر">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' rx=\'22\' fill=\'%2300D4E8\'/><text y=\'.9em\' font-size=\'65\' x=\'50%\' text-anchor=\'middle\'>⚡</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{ --cyan:#00D4E8; --cyan-glow:rgba(0,212,232,.35); --bg:#F2F5F9; --card:#fff; --fg:#161d2e; --fg2:#5a647a; --fg3:#8a94a8; --radius:20px; --shadow:0 10px 30px rgba(0,0,0,.07); --shadow-3d:0 25px 50px rgba(0,0,0,.12); }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth} body{font-family:\'Tajawal\',sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;overflow-x:hidden}
.container{width:min(1200px,94%);margin-inline:auto}
/* هيدر زجاجي */
header{ background:rgba(255,255,255,.85); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-bottom:1px solid rgba(0,0,0,.06); position:sticky;top:0;z-index:100; }
.header-inner{display:flex;align-items:center;gap:16px;padding:14px 0}
.logo-icon{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--cyan) 0%,#0099aa 100%);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 20px var(--cyan-glow)}
.logo-text .logo-ar{font-family:\'Cairo\',sans-serif;font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--cyan) 0%,#0099aa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;display:block;line-height:1}
.logo-text span:last-child{font-size:10px;color:var(--fg3);letter-spacing:3px;display:block}
.search-wrap{flex:1;max-width:480px;position:relative} .search-wrap input{width:100%;padding:11px 44px 11px 16px;border-radius:30px;border:1.5px solid #e2e8f0;background:#fff}
.search-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;position:relative}
.cart-badge{position:absolute;top:-4px;left:-4px;width:19px;height:19px;border-radius:50%;background:var(--cyan);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0);transition:.25s} .cart-badge.show{opacity:1;transform:scale(1)}
/* هيرو 3D */
.hero{ background:radial-gradient(ellipse at 20% 20%, rgba(0,212,232,.2) 0%, transparent 50%), linear-gradient(135deg,#051a1e 0%,#0a2a30 50%, #0e3a45 100%); padding:70px 0; position:relative; overflow:hidden; }
.hero::after{content:\'\';position:absolute;width:700px;height:700px;background:radial-gradient(circle, rgba(0,212,232,.18) 0%, transparent 70%);top:-250px;left:-150px;filter:blur(30px);animation:floatOrb 6s ease-in-out infinite}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;position:relative;z-index:1}
.hero-tag{display:inline-block;background:rgba(0,212,232,.12);border:1px solid rgba(0,212,232,.3);color:var(--cyan);padding:6px 14px;border-radius:30px;font-size:13px;font-weight:700;margin-bottom:16px}
.hero h1{font-family:\'Cairo\',sans-serif;font-size:clamp(36px,5vw,58px);font-weight:900;color:#fff;line-height:1.1;margin-bottom:16px} .hero h1 em{color:var(--cyan);font-style:normal;text-shadow:0 0 30px var(--cyan-glow)}
.hero p{color:rgba(255,255,255,.7);font-size:17px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:30px;font-weight:800;transition:.3s}
.btn-primary{background:var(--cyan);color:#051a1e;box-shadow:0 10px 30px var(--cyan-glow)} .btn-primary:hover{transform:translateY(-3px)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.3);color:#fff} .btn-ghost:hover{background:rgba(255,255,255,.1)}
.hero-3d{perspective:1200px;display:flex;align-items:center;justify-content:center;height:400px}
.hero-card-3d{width:300px;height:380px;background:linear-gradient(180deg,#fff 0%, #f8fafc 100%);border-radius:24px;box-shadow:var(--shadow-3d);padding:18px;transform:rotateY(-14deg) rotateX(10deg);animation:floatCard 5s ease-in-out infinite;position:relative;overflow:hidden}
.hero-card-3d::before{content:\'\';position:absolute;inset:0;border-radius:24px;background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.8) 50%, transparent 60%);transform:translateX(-100%);animation:shine 3s infinite}
.hero-card-3d img{width:100%;height:220px;object-fit:cover;border-radius:16px}
@keyframes floatCard{0%,100%{transform:rotateY(-14deg) rotateX(10deg) translateY(0)}50%{transform:rotateY(-14deg) rotateX(10deg) translateY(-18px)}}
@keyframes shine{100%{transform:translateX(100%)}} @keyframes floatOrb{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,30px)}}
/* كاتيجوري */
.cats{padding:30px 0 10px} .cats-row{display:flex;gap:10px;flex-wrap:wrap}
.cat-pill{padding:10px 22px;border-radius:30px;font-weight:700;border:1.5px solid #e2e8f0;background:#fff;transition:.25s}
.cat-pill.active,.cat-pill:hover{background:var(--cyan);border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 8px 20px var(--cyan-glow)}
/* كروت 3D */
.products{padding:30px 0 60px} .section-head{display:flex;gap:12px;align-items:baseline;margin-bottom:20px} .section-head h2{font-family:\'Cairo\',sans-serif;font-size:24px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .3s;transform-style:preserve-3d;will-change:transform;display:flex;flex-direction:column}
.card:hover{box-shadow:var(--shadow-3d)} .card-img{height:230px;overflow:hidden;background:#f1f5f9;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;transition:.5s} .card:hover .card-img img{transform:scale(1.07)}
.badge{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800} .badge-sale{background:#ff4757;color:#fff}
.card-body{padding:16px;flex:1;display:flex;flex-direction:column} .card-brand{color:var(--cyan);font-size:11px;font-weight:800} .card-name{font-weight:700;margin:4px 0 10px;min-height:44px}
.price-new{font-family:\'Cairo\',sans-serif;font-size:20px;font-weight:900} .price-old{color:var(--fg3);text-decoration:line-through;font-size:13px}
.card-footer{display:flex;gap:8px;margin-top:auto} .add-btn{flex:1;padding:11px;border-radius:12px;background:var(--cyan);font-weight:800;box-shadow:0 6px 16px var(--cyan-glow)}
.wish-btn{width:42px;height:42px;border-radius:12px;border:1.5px solid #e2e8f0}
/* باقي السلة والفوتر نفس القديم */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:.25s} .overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;z-index:201;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column} .drawer.open{transform:translateX(0)}
footer{background:#051a1e;color:rgba(255,255,255,.7);padding:40px 0 20px}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr} .hero-3d{display:none}}
</style>
</head>
<body>
<header>
  <div class="container header-inner">
    <a href="/" style="display:flex;gap:12px;align-items:center"><div class="logo-icon">⚡</div><div class="logo-text"><span class="logo-ar">حَرِيْر</span><span>اكسسوارات الموبايل</span></div></a>
    <div class="search-wrap"><input type="search" id="searchInput" placeholder="ابحث عن منتج..."><span class="icon">🔍</span></div>
    <div style="display:flex;gap:8px;margin-inline-start:auto"><button onclick="toggleLang()" style="padding:6px 14px;border-radius:20px;border:1.5px solid #e2e8f0;font-weight:700" id="langBtn">EN</button><button class="icon-btn" id="cartBtn">🛒<span class="cart-badge" id="cartBadge">0</span></button></div>
  </div>
</header>
<section class="hero">
  <div class="container hero-grid">
    <div>
      <div class="hero-tag">✨ أصلي 100% — ضمان وفاتورة</div>
      <h1>شحن سريع<br><em>بشكل أسرع</em></h1>
      <p>Anker و Apple و Samsung و 3TECH — الأفضل بأسعار منافسة وتوصيل لكل مصر</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><a href="#products" class="btn btn-primary">🛍️ تسوق الآن</a><a href="#products" class="btn btn-ghost">اعرف أكتر</a></div>
    </div>
    <div class="hero-3d">
      <div class="hero-card-3d">
        <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400" alt="product">
        <div style="margin-top:12px"><div style="color:var(--cyan);font-weight:800;font-size:12px">ANKER</div><div style="font-weight:800">شاحن Anker سريع 65W</div><div style="color:var(--cyan);font-weight:900;font-size:20px;margin-top:6px">899 ج.م</div></div>
      </div>
    </div>
  </div>
</section>
<section class="cats"><div class="container"><div class="cats-row" id="catsRow"><button class="cat-pill active" data-slug="all">كل المنتجات</button></div></div></section>
<section class="products" id="products"><div class="container"><div class="section-head"><h2>منتجاتنا</h2><span id="countLabel" style="color:var(--fg3)"></span></div><div class="grid" id="productsGrid"></div></div></section>
<footer><div class="container" style="text-align:center">© 2025 حرير — جميع الحقوق محفوظة</div></footer>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="cartDrawer"><div style="padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><h3>🛒 سلتك</h3><button id="closeCart">✕</button></div><div id="cartItems" style="flex:1;overflow:auto;padding:16px"></div><div style="padding:20px;border-top:1px solid #eee"><div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px"><span>الإجمالي</span><span id="cartTotal">0 ج.م</span></div><button id="checkoutBtn" style="width:100%;padding:14px;border-radius:12px;background:var(--cyan);font-weight:800">إتمام الطلب 🚀</button></div></aside>
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e2230;color:#fff;padding:12px 24px;border-radius:30px;transition:.3s;z-index:999"></div>
<script>
// === نفس كود Supabase بتاعك بالظبط بدون اي تغيير ===
const SUPABASE_URL = \'https://ojocqktlpegfksfmoens.supabase.co\';
const SUPABASE_KEY = \'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qb2Nxa3RscGVnZmtzZm1vZW5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1Nzk2MjksImV4cCI6MjEwNzE1NTYyOX0.xQSaKAngmR6qa0I1FegQ59VmT0RtfhNObnaQ9mmCJ1E\';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let cart = JSON.parse(localStorage.getItem(\'harir_cart\') || \'[]\');
let allProducts = []; let activeSlug = \'all\'; let searchQ = \'\';
function saveCart(){ localStorage.setItem(\'harir_cart\',JSON.stringify(cart)) }
async function loadCategories(){ const { data } = await sb.from(\'categories\').select(\'*\').order(\'id\'); if(!data) return; const row=document.getElementById(\'catsRow\'); data.forEach(c=>{ const b=document.createElement(\'button\'); b.className=\'cat-pill\'; b.dataset.slug=c.slug; b.innerHTML=c.name; b.onclick=()=>{activeSlug=c.slug;document.querySelectorAll(\'.cat-pill\').forEach(x=>x.classList.toggle(\'active\',x.dataset.slug===c.slug));renderProducts()}; row.appendChild(b)}); }
async function loadProducts(){ const { data } = await sb.from(\'products\').select(\'*, categories(slug,name)\').order(\'created_at\',{ascending:false}); allProducts=data||[]; renderProducts(); }
function renderProducts(){
  const grid=document.getElementById(\'productsGrid\');
  let list=allProducts.filter(p=>{ const mCat=activeSlug===\'all\'||p.categories?.slug===activeSlug; const mQ=!searchQ||p.name.includes(searchQ); return mCat&&mQ;});
  document.getElementById(\'countLabel\').textContent=list.length+\' منتج\';
  if(!list.length){ grid.innerHTML=\'<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--fg3)">لا توجد نتائج</div>\'; return; }
  grid.innerHTML=list.map(p=>{ const disc=p.old_price?Math.round((1-p.price/p.old_price)*100):0; return `<article class="card"><div class="card-img"><img src="${p.image_url||\'https://via.placeholder.com/400\'}" loading="lazy">${disc?`<span class="badge badge-sale">-${disc}%</span>`:\'\'}</div><div class="card-body"><div class="card-brand">${p.brand||\'\'}</div><div class="card-name">${p.name}</div><div style="display:flex;gap:8px;align-items:baseline"><span class="price-new">${p.price} ج.م</span>${p.old_price?`<span class="price-old">${p.old_price} ج.م</span>`:\'\'}</div><div class="card-footer" style="margin-top:12px"><button class="add-btn" onclick="addToCart(\'${p.id}\')">🛒 أضف للسلة</button><button class="wish-btn" onclick="this.classList.toggle(\'active\')">♡</button></div></div></article>`}).join(\'\');
  initTilt();
}
function initTilt(){
  document.querySelectorAll(\'.card\').forEach(card=>{
    card.addEventListener(\'mousemove\', e=>{
      const rect=card.getBoundingClientRect(); const x=e.clientX-rect.left; const y=e.clientY-rect.top;
      const rotateY=(x/rect.width - .5)*14; const rotateX=(.5 - y/rect.height)*14;
      card.style.transform=`perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px)`;
    });
    card.addEventListener(\'mouseleave\', ()=> card.style.transform=\'perspective(900px) rotateX(0) rotateY(0) translateY(0)\');
  });
}
function addToCart(id){ const p=allProducts.find(x=>x.id===id); const it=cart.find(i=>i.id===id); if(it) it.qty++; else cart.push({id:p.id,name:p.name,price:p.price,image_url:p.image_url,qty:1}); saveCart(); updateCartUI(); toast(\'✅ تمت الإضافة للسلة\'); }
function updateCartUI(){ const total=cart.reduce((s,i)=>s+i.price*i.qty,0); const count=cart.reduce((s,i)=>s+i.qty,0); const b=document.getElementById(\'cartBadge\'); b.textContent=count; b.classList.toggle(\'show\',count>0); document.getElementById(\'cartTotal\').textContent=total.toLocaleString(\'ar-EG\')+\' ج.م\'; const box=document.getElementById(\'cartItems\'); if(!cart.length){box.innerHTML=\'<div style="text-align:center;padding:40px;color:var(--fg3)">السلة فارغة</div>\';return} box.innerHTML=cart.map(i=>`<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f9"><img src="${i.image_url}" style="width:60px;height:60px;border-radius:10px;object-fit:cover"><div style="flex:1"><div style="font-weight:700">${i.name}</div><div style="color:var(--cyan);font-weight:800">${i.price*i.qty} ج.م</div></div><button onclick="cart=cart.filter(x=>x.id!==\'${i.id}\');saveCart();updateCartUI()">🗑</button></div>`).join(\'\'); }
function toast(m){ const el=document.getElementById(\'toast\'); el.textContent=m; el.style.transform=\'translateX(-50%) translateY(0)\'; setTimeout(()=>el.style.transform=\'translateX(-50%) translateY(100px)\',2500)}
document.getElementById(\'searchInput\').addEventListener(\'input\',e=>{searchQ=e.target.value.trim();renderProducts()});
document.getElementById(\'cartBtn\').onclick=()=>{document.getElementById(\'cartDrawer\').classList.add(\'open\');document.getElementById(\'overlay\').classList.add(\'open\')};
document.getElementById(\'closeCart\').onclick=document.getElementById(\'overlay\').onclick=()=>{document.getElementById(\'cartDrawer\').classList.remove(\'open\');document.getElementById(\'overlay\').classList.remove(\'open\')};
function toggleLang(){}
(async()=>{ await Promise.all([loadCategories(),loadProducts()]); updateCartUI(); })();
</script>
</body>
</html>
